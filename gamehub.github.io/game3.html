<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>迷宮逃生遊戲</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
    }
    #mazeCanvas {
      background-color: #000;
      border: 2px solid #444;
      display: block;
    }
    #instructions {
      margin-top: 15px;
      font-size: 16px;
      text-align: center;
      color: #ccc;
    }
    #status {
      margin-top: 10px;
      font-size: 18px;
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <h1>迷宮逃生遊戲</h1>
  <canvas id="mazeCanvas" width="650" height="650"></canvas>
  <div id="instructions">使用方向鍵 ← ↑ → ↓ 移動玩家（藍色）<br>避開紅色鬼魂，抵達紅色終點！</div>
  <div id="status"></div>

  <script>
    const canvas = document.getElementById('mazeCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    
    const cellSize = 26;
    const cols = Math.floor(canvas.width / cellSize); // 25
    const rows = Math.floor(canvas.height / cellSize); // 25
    
    let maze = [];
    let player = { x: 1, y: 1 };
    let ghost = { x: 1, y: 2 }; // ✅ 鬼一開始在玩家背後（正下方）
    let goal = { x: cols - 2, y: rows - 2 };
    let gameActive = true;

    // 生成更複雜的隨機迷宮
    function generateMaze() {
      // 初始化全牆
      maze = Array(rows).fill().map(() => Array(cols).fill(1));
      
      // DFS 迷宮生成（更密集）
      function carve(x, y) {
        maze[y][x] = 0;
        const directions = [
          [0, -2], [2, 0], [0, 2], [-2, 0]
        ];
        // 打亂方向
        for (let i = directions.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [directions[i], directions[j]] = [directions[j], directions[i]];
        }
        
        for (const [dx, dy] of directions) {
          const nx = x + dx;
          const ny = y + dy;
          if (nx > 0 && nx < cols - 1 && ny > 0 && ny < rows - 1 && maze[ny][nx] === 1) {
            maze[y + Math.floor(dy / 2)][x + Math.floor(dx / 2)] = 0;
            carve(nx, ny);
          }
        }
      }
      
      carve(1, 1);
      
      // 確保終點區域可達
      maze[rows - 2][cols - 2] = 0;
      maze[rows - 2][cols - 3] = 0;
      maze[rows - 3][cols - 2] = 0;
      maze[rows - 3][cols - 3] = 0;
    }

    // 檢查座標是否有效道路
    function isPath(x, y) {
      return x >= 0 && x < cols && y >= 0 && y < rows && maze[y][x] === 0;
    }

    // 鬼魂追蹤玩家
    function moveGhost() {
      if (!gameActive) return;
      
      let bestDist = Infinity;
      let nextX = ghost.x;
      let nextY = ghost.y;
      
      const directions = [[0, -1], [1, 0], [0, 1], [-1, 0]];
      for (const [dx, dy] of directions) {
        const nx = ghost.x + dx;
        const ny = ghost.y + dy;
        if (isPath(nx, ny)) {
          const dist = Math.abs(nx - player.x) + Math.abs(ny - player.y);
          if (dist < bestDist) {
            bestDist = dist;
            nextX = nx;
            nextY = ny;
          }
        }
      }
      
      ghost.x = nextX;
      ghost.y = nextY;
      
      // 檢查是否碰到玩家
      if (ghost.x === player.x && ghost.y === player.y) {
        statusEl.textContent = "被鬼抓到了！遊戲重新開始...";
        setTimeout(restartGame, 1500);
        gameActive = false;
      }
    }

    // 繪製遊戲
    function draw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // 畫迷宮道路（白色）
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (maze[y][x] === 0) {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
          }
        }
      }
      
      // 畫終點（紅色）
      ctx.fillStyle = '#FF4444';
      ctx.fillRect(goal.x * cellSize, goal.y * cellSize, cellSize, cellSize);
      
      // 畫鬼魂（深紅）
      ctx.fillStyle = '#CC0000';
      ctx.fillRect(ghost.x * cellSize, ghost.y * cellSize, cellSize, cellSize);
      
      // 畫玩家（藍色）
      ctx.fillStyle = '#4285F4';
      ctx.fillRect(player.x * cellSize, player.y * cellSize, cellSize, cellSize);
    }

    // 重新開始遊戲
    function restartGame() {
      generateMaze();
      player = { x: 1, y: 1 };
      ghost = { x: 1, y: 2 }; // ✅ 每次重開，鬼都在玩家背後
      goal = { x: cols - 2, y: rows - 2 };
      gameActive = true;
      statusEl.textContent = "";
      draw();
      gameLoop();
    }

    // 鍵盤控制
    document.addEventListener('keydown', (e) => {
      if (!gameActive) return;
      
      let newX = player.x;
      let newY = player.y;
      
      switch (e.key) {
        case 'ArrowUp':    newY--; break;
        case 'ArrowDown':  newY++; break;
        case 'ArrowLeft':  newX--; break;
        case 'ArrowRight': newX++; break;
        default: return;
      }
      
      if (isPath(newX, newY)) {
        player.x = newX;
        player.y = newY;
        
        // 檢查是否到達終點
        if (player.x === goal.x && player.y === goal.y) {
          statusEl.textContent = "恭喜逃脫成功！";
          gameActive = false;
          setTimeout(() => {
            statusEl.textContent = "開始新一局...";
            setTimeout(restartGame, 1000);
          }, 1500);
        }
        
        draw();
      }
    });

    // 主遊戲循環：鬼魂每 600ms 移動一次（降低速度，增加難度）
    let ghostInterval;
    function gameLoop() {
      if (ghostInterval) clearInterval(ghostInterval);
      ghostInterval = setInterval(moveGhost, 600); // ✅ 從 400 改為 600
    }

    // 開始遊戲
    restartGame();
  </script>
</body>
</html>
