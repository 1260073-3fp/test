from IPython.display import HTML

html_snake_game = """
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>雙蘋果貪食蛇</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #000;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #gameCanvas {
      border: 1px solid #444;
      background-color: #000;
    }
    #ui {
      margin-top: 15px;
      display: flex;
      gap: 20px;
      align-items: center;
      font-size: 1.1em;
    }
    #restartBtn {
      padding: 6px 14px;
      background: #333;
      color: white;
      border: 1px solid #666;
      border-radius: 4px;
      cursor: pointer;
    }
    #restartBtn:hover {
      background: #555;
    }
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 25px;
      border-radius: 10px;
      text-align: center;
      display: none;
    }
    .legend {
      display: flex;
      gap: 15px;
      margin-top: 10px;
      font-size: 0.9em;
      opacity: 0.8;
    }
    .red { color: #FF0000; }
    .yellow { color: #FFFF00; }
  </style>
</head>
<body>
  <h1>貪食蛇：雙蘋果挑戰</h1>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  
  <div id="ui">
    <div id="score">分數: 0</div>
    <button id="restartBtn">重新開始</button>
  </div>
  
  <div class="legend">
    <span><span class="red">●</span> 紅蘋果 (+1 長度, +10 分)</span>
    <span><span class="yellow">●</span> 黃蘋果 (+2 長度, +20 分)</span>
  </div>

  <div id="gameOver">
    <h2>遊戲結束！</h2>
    <p>最終分數: <span id="finalScore">0</span></p>
    <button id="restartBtnModal">再玩一次</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('finalScore');
    const gameOverEl = document.getElementById('gameOver');
    const restartBtn = document.getElementById('restartBtn');
    const restartBtnModal = document.getElementById('restartBtnModal');

    const CELL_SIZE = 20;
    const COLS = canvas.width / CELL_SIZE;
    const ROWS = canvas.height / CELL_SIZE;

    let snake = [];
    let food = { x: 0, y: 0, type: 'red' };
    let direction = 'right';
    let nextDirection = 'right';
    let score = 0;
    let gameRunning = false;
    let gameSpeed = 140;
    let gameInterval;

    function initGame() {
      snake = [
        { x: 5, y: 10 },
        { x: 4, y: 10 },
        { x: 3, y: 10 }
      ];
      direction = 'right';
      nextDirection = 'right';
      score = 0;
      scoreEl.textContent = `分數: ${score}`;
      gameOverEl.style.display = 'none';
      generateFood();
      gameRunning = true;
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, gameSpeed);
    }

    function generateFood() {
      let newFood;
      let onSnake;
      do {
        onSnake = false;
        newFood = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS),
          type: Math.random() < 0.7 ? 'red' : 'yellow'
        };
        for (const seg of snake) {
          if (seg.x === newFood.x && seg.y === newFood.y) {
            onSnake = true;
            break;
          }
        }
      } while (onSnake);
      food = newFood;
    }

    function gameLoop() {
      if (!gameRunning) return;
      direction = nextDirection;

      const head = { ...snake[0] };
      switch (direction) {
        case 'up': head.y--; break;
        case 'down': head.y++; break;
        case 'left': head.x--; break;
        case 'right': head.x++; break;
      }

      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        endGame();
        return;
      }

      for (const seg of snake) {
        if (seg.x === head.x && seg.y === head.y) {
          endGame();
          return;
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        if (food.type === 'red') {
          score += 10;
        } else {
          score += 20;
        }
        scoreEl.textContent = `分數: ${score}`;
        generateFood();

        if (score % 50 === 0 && gameSpeed > 70) {
          gameSpeed -= 8;
          clearInterval(gameInterval);
          gameInterval = setInterval(gameLoop, gameSpeed);
        }
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#00FF00';
      for (const seg of snake) {
        ctx.fillRect(seg.x * CELL_SIZE, seg.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      }

      ctx.fillStyle = food.type === 'red' ? '#FF0000' : '#FFFF00';
      ctx.fillRect(food.x * CELL_SIZE, food.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
    }

    function endGame() {
      gameRunning = false;
      clearInterval(gameInterval);
      finalScoreEl.textContent = score;
      gameOverEl.style.display = 'block';
    }

    document.addEventListener('keydown', (e) => {
      if (!gameRunning) return;
      switch (e.key) {
        case 'ArrowUp':
          if (direction !== 'down') nextDirection = 'up';
          break;
        case 'ArrowDown':
          if (direction !== 'up') nextDirection = 'down';
          break;
        case 'ArrowLeft':
          if (direction !== 'right') nextDirection = 'left';
          break;
        case 'ArrowRight':
          if (direction !== 'left') nextDirection = 'right';
          break;
      }
    });

    restartBtn.addEventListener('click', initGame);
    restartBtnModal.addEventListener('click', initGame);

    initGame();
  </script>
</body>
</html>
"""

# 在 Jupyter Notebook 中顯示遊戲
HTML(html_snake_game)
